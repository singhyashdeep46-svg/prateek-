<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1E6B47">

<title>Plate Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap">
<style>
:root{--bg:#E9EEEA;--sf:#F7F9F6;--ink:#14231B;--mu:#5B6B62;--leaf:#1E6B47;--tur:#E9A91A;--chi:#C2381F;--ln:#CBD5CD;--glass:rgba(247,249,246,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1713;--sf:#17221C;--ink:#E8EFE9;--mu:#94A59B;--leaf:#4FBF86;--tur:#F2B83A;--chi:#F0705A;--ln:#263429;--glass:rgba(23,34,28,.72);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1713;--sf:#17221C;--ink:#E8EFE9;--mu:#94A59B;--leaf:#4FBF86;--tur:#F2B83A;--chi:#F0705A;--ln:#263429;--glass:rgba(23,34,28,.72);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1,h2,.big{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0}
h1{font-size:28px;font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:600;margin:26px 0 10px}
.sub{color:var(--mu);font-size:14px;margin:2px 0 0}
.plate{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:18px auto 6px}
.plate svg{width:100%;height:100%;transform:rotate(-90deg)}
.plate .ring{transition:stroke-dashoffset .6s ease,stroke .3s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16%}
.big{font-size:56px;font-weight:800;line-height:1}
.mid small{color:var(--mu);font-size:14px;margin-top:6px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stats .card{margin:0}
.stats b{display:block;font:800 22px "Bricolage Grotesque",sans-serif}
.stats span{color:var(--mu);font-size:13px}
.bar{height:8px;border-radius:8px;background:var(--ln);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px "DM Sans",sans-serif;cursor:pointer;min-height:40px}
.chip:hover{border-color:var(--leaf)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:8px;color:var(--ink);font:inherit;cursor:pointer;min-height:48px}
.row span small{display:block;color:var(--mu);font-size:13px}
.row b{white-space:nowrap}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--tur)}
.dots i.on{background:var(--tur)}
.btn{background:var(--leaf);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:700 15px "DM Sans",sans-serif;cursor:pointer;min-height:48px}
:root[data-theme="dark"] .btn{color:#06130C}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06130C}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.del{background:transparent;color:var(--chi);border:1px solid var(--chi)}
.add{width:100%;margin-top:14px}
.dayh{display:flex;justify-content:space-between;margin:20px 2px 0;font-weight:700}
.dayh span{color:var(--mu);font-weight:400}
label{display:block;font-size:14px;color:var(--mu);margin-top:12px}
input,select{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:1px solid var(--ln);border-radius:20px;background:var(--sf);color:var(--ink);width:min(92vw,420px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.acts{display:flex;gap:10px;margin-top:18px}
.acts .btn{flex:1}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--ln);width:min(92vw,420px)}
nav button{flex:1;border:0;background:transparent;color:var(--mu);font:500 14px "DM Sans",sans-serif;padding:11px 4px;border-radius:16px;cursor:pointer;min-height:44px}
nav button.on{background:var(--leaf);color:#fff;font-weight:700}
:root[data-theme="dark"] nav button.on{color:#06130C}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:#06130C}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--tur);outline-offset:2px}
.hint{color:var(--mu);font-size:14px;margin:8px 2px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:600px){dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.wg{min-height:78vh;display:flex;flex-direction:column;justify-content:center}
.wg .plate{width:min(250px,68vw)}
.wg .big{font-size:46px}
.tiny{display:flex;justify-content:center;gap:22px;color:var(--mu);font-size:14px;text-align:center;margin-top:8px}
.tiny b{display:block;color:var(--ink);font:800 20px "Bricolage Grotesque",sans-serif}
.wg .chips{justify-content:center;margin-top:18px}
.wg .chip{min-height:48px;font-size:15px}
.wlinks{display:flex;justify-content:center;gap:10px;margin-top:20px}
.wlinks .btn{padding:12px 14px}
.btn:disabled{opacity:.4}
@media(prefers-reduced-motion:reduce){.plate .ring{transition:none}}
:root{--bg:#CBD8CF;--sf:#fff;--ink:#101713;--mu:#5E6D66;--mu2:#6C7B74;--ln:#E3EAE5;--glass:rgba(255,255,255,.78)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1310;--sf:#18211C;--ink:#EEF3EF;--mu:#97A59D;--mu2:#7F8D86;--ln:#27332B;--glass:rgba(24,33,28,.78)}}
:root[data-theme="dark"]{--bg:#0D1310;--sf:#18211C;--ink:#EEF3EF;--mu:#97A59D;--mu2:#7F8D86;--ln:#27332B;--glass:rgba(24,33,28,.78)}
body,button,input,select,h1,h2,.big,.stats b,.tiny b,.chip,.btn,nav button{font-family:Manrope,system-ui,sans-serif}
body{font-size:15px;font-variant-numeric:tabular-nums}
main{padding:24px 20px 124px}
h1{font-size:34px;line-height:1.04;letter-spacing:-.03em;font-weight:800}
h1 span{display:block;color:var(--mu2)}
h2{font-size:20px;letter-spacing:-.02em;margin:32px 0 4px}
.sub{font-size:14px;margin-top:6px}
#app>.plate{display:none}
.hero{background:var(--sf);border-radius:28px;padding:22px 20px;margin-top:22px}
.hr{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:600;color:var(--mu)}
.hn{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:12px}
.hn small{font-size:16px;font-weight:600;color:var(--mu);margin-left:8px;letter-spacing:0}
.ticks{display:flex;gap:3px;height:48px;margin:18px 0 16px}
.ticks i{flex:1;border-radius:3px;background:var(--ln)}
.ticks i.on{background:var(--c);transform-origin:bottom;animation:grow .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes grow{from{transform:scaleY(.15);opacity:0}}
.card,.row,.chip{border:0}
.card{border-radius:22px;padding:18px 20px;margin-top:12px}
.row{border-radius:16px;padding:14px 16px;margin-top:8px}
.row,.chip,.btn,nav button{transition:transform .15s ease}
.row:active,.chip:active,.btn:active,nav button:active{transform:scale(.97)}
.chip{background:var(--sf);font-weight:600;padding:10px 16px}
.btn{background:var(--ink);color:var(--sf);border-radius:16px;letter-spacing:-.01em}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}
.btn.del{border:1.5px solid var(--chi);color:var(--chi);background:transparent}
.btn.add{margin-top:16px}
.stats{gap:12px;margin-top:12px}
.stats b{font-size:24px;letter-spacing:-.03em}
.dayh{margin:28px 4px 4px;font-size:15px}
input,select{background:var(--bg);border:0;border-radius:12px}
label{margin-top:14px;font-weight:500}
dialog{border:0;border-radius:28px;padding:24px 20px}
dialog[open]{animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(28px);opacity:0}}
nav{border:0;box-shadow:0 10px 32px rgba(16,23,19,.14);bottom:calc(14px + env(safe-area-inset-bottom,0px))}
nav button{font-weight:600;border-radius:18px}
nav button.on{background:var(--ink);color:var(--sf)}
.bar i{background:var(--ink)}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--mu);font:600 14px Manrope,system-ui,sans-serif;padding:10px;border-radius:11px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--ink);color:var(--sf)}
html{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
.ic{flex:none}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;padding:8px 4px;min-height:58px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:active{transform:scale(.94)}
.rl{display:flex;align-items:center;gap:12px;min-width:0}
.ri{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--ink)}
.ttl{display:flex;align-items:center;gap:8px}
.btn.add{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.add:not(.ghost)::before{content:"";width:20px;height:20px;background:currentColor;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 5v14M5 12h14' stroke='black' stroke-width='2.4' stroke-linecap='round'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 5v14M5 12h14' stroke='black' stroke-width='2.4' stroke-linecap='round'/></svg>") center/contain no-repeat}
.wlinks .btn{display:flex;align-items:center;gap:6px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 0;color:var(--mu);text-align:center}
.empty p{margin:0}
.em{font-size:22px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.chip .em{font-size:16px;margin-right:6px;vertical-align:-2px}
.dfield{display:block;width:100%;margin-top:4px;padding:11px 12px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;min-height:46px;text-align:left;cursor:pointer}
.lbl{display:block;font-size:14px;color:var(--mu);margin-top:14px;font-weight:500}
#emg button{font-size:13px;padding:10px 2px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ch b{font:800 18px Manrope,system-ui,sans-serif;letter-spacing:-.02em}
.ch span{display:flex;gap:8px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cw span{font-size:12px;font-weight:600;color:var(--mu);padding:6px 0}
.cg button{aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);font:600 15px Manrope,system-ui,sans-serif;cursor:pointer}
.cg button.td{box-shadow:inset 0 0 0 1.5px var(--leaf)}
.cg button.on{background:var(--ink);color:var(--sf)}
.cg button:active{transform:scale(.94)}
:root{--bg:#FBF3E1;--sf:#FFFDF6;--ink:#123B4A;--mu:#4F6F7B;--mu2:#EE5A43;--ln:#EADFC6;--leaf:#4E8A35;--tur:#F5B72E;--chi:#C93A25;--glass:rgba(255,253,246,.8);--yel:#F5B72E;--grn:#7DB659;--grn2:#4E8A35;--onG:#fff;--hero:#1D6076;--btn:#1D6076;--btnt:#FFF8E8;--navbg:#1D6076;--wm:#1D6076}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E2A34;--sf:#174553;--ink:#FBF3E1;--mu:#A9C4CC;--mu2:#FF8A75;--ln:#245869;--leaf:#8BC56A;--chi:#FF7A66;--glass:rgba(23,69,83,.82);--grn2:#8BC56A;--onG:#0E2A34;--hero:#236F87;--btn:#FBF3E1;--btnt:#0E2A34;--navbg:#174553;--wm:#FBF3E1}}
:root[data-theme="dark"]{--bg:#0E2A34;--sf:#174553;--ink:#FBF3E1;--mu:#A9C4CC;--mu2:#FF8A75;--ln:#245869;--leaf:#8BC56A;--chi:#FF7A66;--glass:rgba(23,69,83,.82);--grn2:#8BC56A;--onG:#0E2A34;--hero:#236F87;--btn:#FBF3E1;--btnt:#0E2A34;--navbg:#174553;--wm:#FBF3E1}
body,button,input,select,h1,h2,.big,.stats b,.tiny b,.chip,.btn,nav button,.ch b,.cg button,.seg button{font-family:Fredoka,system-ui,sans-serif}
body{font-size:16px}
h1{font-weight:700;letter-spacing:-.02em}
.wm{font:400 22px "Titan One",Fredoka,sans-serif;color:var(--wm);margin-bottom:8px;letter-spacing:.01em}
.card{border-radius:26px}
.row{border-radius:20px}
.hero{background:var(--hero);color:#FBF3E1;border-radius:30px}
.hero .hr,.hero .hn small{color:#CFE3E8}
.hero .hn{color:#FBF3E1!important}
.hero .ticks i{background:rgba(251,243,225,.18)}
.hero .ticks i.on{background:var(--yel)}
.stats .card:nth-child(1){background:var(--yel)}

.stats .card,.stats .card span,.stats .card .sub,.tip{color:#123B4A}

.stats .bar i{background:#123B4A}
.card:has(.ttl){background:#D63F29;color:#fff}

.card:has(.ttl) .dots i{border-color:#fff}
.card:has(.ttl) .dots i.on{background:#fff}
.tip{display:flex;gap:14px;align-items:center;background:var(--grn);border-radius:26px;padding:16px 18px;margin-top:12px}
.tip b{display:block;font-size:17px}
.tip p{margin:2px 0 0;font-size:14px;line-height:1.4}
.tip svg{flex:none}
.chip{background:var(--yel);color:#123B4A;font-weight:600}
.btn{background:var(--btn);color:var(--btnt);font-weight:600}
.btn.add:not(.ghost){background:var(--grn2);color:var(--onG)}
nav{background:var(--navbg);border-radius:999px;box-shadow:none;padding:6px 8px;-webkit-backdrop-filter:none;backdrop-filter:none}

nav button.on{background:#FBF3E1;color:#123B4A}
nav button:nth-child(2){margin-right:34px}
nav button:nth-child(3){margin-left:34px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:5px solid var(--bg);background:var(--grn2);color:var(--onG);display:grid;place-items:center;cursor:pointer;z-index:5;transition:transform .15s ease}
.fab:active{transform:translateX(-50%) scale(.93)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

<body>
<main id="app" class="in"></main>
<nav id="nav"></nav>
<button class="fab" id="fab" onclick="openEntry()" aria-label="Add meal"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<dialog id="de" aria-labelledby="det">
  <h2 id="det" style="margin-top:0">Add meal</h2>
  <label>What did you eat<input id="en" list="ml" autocomplete="off" placeholder="Thali, biryani, tea"></label>
  <datalist id="ml"></datalist>
  <div class="two">
    <label>Price (₹)<input id="ep" type="number" inputmode="numeric" min="0"></label>
    <label>Date<button type="button" class="dfield" id="edb" onclick="openCal()"></button><input id="ed" type="hidden"></label>
  </div>
  <div class="lbl">Meal<input id="em" type="hidden"><div class="seg" id="emg"><button type="button" data-m="b" onclick="setM('b')">Breakfast</button><button type="button" data-m="l" onclick="setM('l')">Lunch</button><button type="button" data-m="d" onclick="setM('d')">Dinner</button><button type="button" data-m="s" onclick="setM('s')">Snack</button></div></div>
  <div class="acts"><button class="btn ghost" onclick="de.close()">Cancel</button><button class="btn del" id="edel" onclick="delEntry()">Delete</button><button class="btn" onclick="saveEntry()">Save</button></div>
</dialog>

<dialog id="di" aria-labelledby="dit">

 <div class="plate"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="var(--sf)" stroke="var(--ln)" stroke-width="2"/><circle cx="100" cy="100" r="84" fill="none" stroke="var(--ln)" stroke-width="12"/>
 <circle class="ring" cx="100" cy="100" r="84" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>
 <div class="mid"><div class="big" style="color:${left<0?"var(--chi)":"var(--ink)"}">${rs(Math.abs(left))}</div><small>${left<0?"over today’s lunch and dinner cap":"left for lunch and dinner"}</small><small>of ${rs(s.cap)}</small></div></div>
 <div class="hero"><div class="hr"><span>Lunch and dinner</span><span>${rs(s.cap)} a day</span></div><div class="hn" style="color:${left<0?"var(--chi)":"var(--ink)"}"><span data-n="${Math.abs(left)}">${rs(Math.abs(left))}</span><small>${left<0?"over today":"left today"}</small></div><div class="ticks" style="--c:${col}">${Array.from({length:36},(_,i)=>`<i class="${i<Math.round(frac*36)?"on":""}" style="--d:${i*14}ms"></i>`).join("")}</div><div class="hr"><span>Spent ${rs(spentLD)}</span><span>Breakfast and snacks ${rs(other)}</span></div></div>
 <div class="card"><p style="margin:0">${msg}</p>${fits.length&&left>=0?`<div class="chips">${fits.map(x=>`<button class="chip" onclick='openEntry(null,${JSON.stringify({n:x.n,p:x.p})})'><span class="em">${fi(x.n)}</span>${e(x.n)} ${rs(x.p)}</button>`).join("")}</div>`:""}</div>
 <button class="btn add" onclick="openEntry()">Add a meal</button>
 <div class="stats"><div class="card"><b>${rs(Math.max(rem,0))}</b><span>left this month of ${rs(s.month)}</span><div class="bar"><i style="width:${Math.min(spent/s.month*100,100)}%"></i></div><span>${c.left} days to go</span></div>
 <div class="card"><b>${rs(perDay)}</b><span>a day for the rest of the month</span><p class="sub" style="margin-top:8px">${pace>=0?`${rs(pace)} under pace`:`${rs(-pace)} over pace`}</p></div></div>
 ${(()=>{const pl=s.month/c.total||1,fin=c.left<=10,res=fin?rem:s.month*10/c.total+pace,n=Math.min(10,c.left),fd=Math.min(n,Math.floor(Math.max(res,0)/pl)),d=Math.max(Math.round(res/n),0);return`<div class="card"><b>Last 10 days</b><p class="sub">${fin?`${rs(Math.max(res,0))} left for ${c.left} days, about ${rs(d)} a day.`:`At this pace you enter them with ${rs(Math.max(res,0))}, about ${rs(d)} a day.`}</p><div class="fd">${Array.from({length:n},(_,i)=>`<i class="${i<fd?"on":""}"></i>`).join("")}</div><p class="sub" style="margin:8px 0 0">${fd} of ${n} days covered at ${rs(pl)} a day.</p></div>`})()}
 <div class="card"><b class="ttl">${fi("biryani")}Biryani this week: ${wk} of ${s.bir}</b><div class="dots">${dots}</div>${wk<s.bir?`<p class="sub">${s.bir-wk} still protected. Eat it without guilt.</p>`:`<p class="sub">Done for the week. More is your call.</p>`}</div>
 <div class="tip">${TOM}<div><b>Did you know?</b><p>${TIPS[new Date().getDate()%TIPS.length]}</p></div></div>
 <h2>Today’s meals</h2>${td.length?td.map(row).join(""):`<div class="empty">${TOM}<p>Nothing logged yet.<br>Tap a suggestion or add a meal.</p></div>`}
 ${other?`<p class="hint">Breakfast and snacks (${rs(other)}) count toward the month, not the lunch and dinner cap.</p>`:""}`}
const row=x=>`<button class="row m-${x.m}" onclick="openEntry('${x.id}')"><span class="rl"><span class="ri em">${fi(x.n)}</span><span>${e(x.n)}<small>${ML[x.m]}</small></span></span><b>${rs(x.p)}</b></button>`;

function vLog(){const by={};S.log.forEach(x=>(by[x.d]=by[x.d]||[]).push(x));
 const ds=Object.keys(by).sort().reverse().slice(0,40);
 return`<h1>History</h1><p class="sub">Tap any meal to edit it.</p>`+(ds.length?ds.map(d=>`<div class="dayh">${pd(d).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}<span>${rs(sum(by[d]))}</span></div>${by[d].map(row).join("")}`).join(""):`<div class="empty">${TOM}<p>No meals yet.<br>Your history will fill up here.</p></div>`)+`<button class="btn add" onclick="openEntry()">Add a meal</button>`}

function vMenu(){return`<h1>My menu</h1><p class="sub">Foods you eat and what they usually cost. These power the suggestions.</p>`+
 S.menu.map(x=>`<button class="row" onclick="openItem('${x.id}')"><span class="rl"><span class="ri em">${fi(x.n)}</span><span>${e(x.n)}</span></span><b>${rs(x.p)}</b></button>`).join("")+`<button class="btn add" onclick="openItem()">Add food</button>`}

function split(){const s=S.s,b=s.allow-s.rent-s.month-s.save;return`<b>${rs(Math.abs(b))}</b> ${b>=0?"unspent buffer each month":"short each month"} after rent, food and savings.`}
function vPlan(){const s=S.s,f=(k,l,hint)=>`<label>${l}<input type="number" inputmode="numeric" value="${s[k]}" oninput="setS('${k}',this.value)"></label>`;
 return`<h1>My plan</h1><p class="sub">Change anything. Everything updates straight away.</p>
 <div class="card"><b>Appearance</b><div class="seg">${["auto","light","dark"].map(v=>`<button class="${TH===v?"on":""}" onclick="setTheme('${v}')">${{auto:"Auto",light:"Light",dark:"Dark"}[v]}</button>`).join("")}</div><p class="hint" style="margin-bottom:0">Auto follows your phone’s setting.</p></div>
 <div class="card">${f("month","Monthly food budget (₹)")}${f("cap","Lunch and dinner cap per day (₹)")}${f("bir","Biryani per week")}</div>
 <div class="card">${f("allow","Monthly allowance (₹)")}${f("rent","Monthly rent (₹)")}${f("save","Monthly savings (₹)")}${f("pay","Allowance arrives on day of month (1 to 28)")}
 <p class="hint" id="split">${split()}</p></div>
 <div class="card"><b>Backup and sync</b><p class="hint" id="sync" style="margin:6px 0 0">${syncText()}</p><div class="phrow"><button class="btn ghost" onclick="exportData()">Save backup file</button><button class="btn ghost" onclick="$('imf').click()">Restore from file</button><input id="imf" type="file" accept=".json,application/json" hidden onchange="importData(this)"></div></div>
 <button class="btn ghost add" onclick="resetAll()">Reset everything</button>`}
function setS(k,v){S.s[k]=+v||0;save();const el=$("split");if(el)el.innerHTML=split()}
function resetAll(){ask("Start fresh?","This deletes every meal and setting on this device. It can’t be undone.","Delete everything",()=>{S=seed();S.log=[];save();render();toast("All cleared")},"Keep my data",true)}

function openEntry(id,pre){editId=id||null;const x=id?S.log.find(y=>y.id===id):null,h=new Date().getHours();
 $("det").textContent=x?"Edit meal":"Add meal";$("edel").style.display=x?"":"none";
 $("ml").innerHTML=S.menu.map(m=>`<option value="${e(m.n)}">`).join("");
 $("en").value=x?x.n:pre?pre.n:"";$("ep").value=x?x.p:pre?pre.p:"";setM(x?x.m:h<11?"b":h<17?"l":"d");setD(x?x.d:iso(new Date()));
 $("de").showModal()}
$("en").addEventListener("input",()=>{const m=S.menu.find(x=>x.n.toLowerCase()===$("en").value.trim().toLowerCase());if(m&&!$("ep").value)$("ep").value=m.p});
function saveEntry(){const n=$("en").value.trim(),p=+$("ep").value;if(!n||!(p>=0)||$("ep").value===""){$("en").focus();return}
 const o={d:$("ed").value||iso(new Date()),m:$("em").value,n,p};
 if(editId)Object.assign(S.log.find(y=>y.id===editId),o);else S.log.push({id:uid(),...o});toast(editId?"Meal updated":"Meal added");
 if(!S.menu.some(m=>m.n.toLowerCase()===n.toLowerCase()))ask("Add to your menu?",`Save “${n}” at ${rs(p)} so it shows up as a quick option.`,"Add to menu",()=>{S.menu.push({id:uid(),n,p});save();render();toast("Added to menu")},"Not now");
 save();$("de").close();render()}
function delEntry(){ask("Delete this meal?","It will be removed from your history and totals.","Delete",()=>{S.log=S.log.filter(y=>y.id!==editId);save();$("de").close();render();toast("Meal deleted")},"Keep",true)}
function openItem(id){editItem=id||null;const x=id?S.menu.find(y=>y.id===id):null;$("dit").textContent=x?"Edit food":"Add food";$("idel").style.display=x?"":"none";$("in").value=x?x.n:"";$("ip").value=x?x.p:"";setPh(x&&x.img||"");$("di").showModal()}
function saveItem(){const n=$("in").value.trim(),p=+$("ip").value;if(!n||$("ip").value===""){$("in").focus();return}
 if(editItem)Object.assign(S.menu.find(y=>y.id===editItem),{n,p,img:curPh});else S.menu.push({id:uid(),n,p,img:curPh});save();$("di").close();render()}
function delItem(){ask("Remove this food?","It will leave your menu. Meals you already logged stay in your history.","Remove",()=>{S.menu=S.menu.filter(y=>y.id!==editItem);save();$("di").close();render();toast("Food removed")},"Keep",true)}

const T=[["today","Today",vToday],["log","History",vLog],["menu","Menu",vMenu],["plan","Plan",vPlan]];
function render(){if(tab==="widget"){$("app").innerHTML=vWidget();$("nav").style.display="none";$("fab").style.display="none";return}$("nav").style.display="";$("fab").style.display="";$("app").innerHTML=T.find(t=>t[0]===tab)[2]();$("nav").innerHTML=T.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')" aria-label="${t[1]}"${t[0]===tab?' aria-current="page"':""}>${ic({today:"plate",log:"clock",menu:"list",plan:"sliders"}[t[0]],22)}<span>${t[1]}</span></button>`).join("");countUp()}
function vWidget(){const t=iso(new Date()),c=cycle(),s=S.s,ld=S.log.filter(x=>x.d===t&&(x.m==="l"||x.m==="d")),left=s.cap-sum(ld),
 spent=sum(S.log.filter(x=>x.d>=c.st&&x.d<c.en)),rem=Math.max(s.month-spent,0),after=Math.max(c.left-1,0),perDay=after?Math.floor(rem/after):0,
 wk=S.log.filter(x=>x.d>=weekStart()&&/biryani/i.test(x.n)).length,frac=Math.min(Math.max(left/s.cap,0),1),C=2*Math.PI*84,
 col=left<0?"var(--chi)":frac<.35?"var(--tur)":"var(--leaf)",fits=S.menu.filter(x=>x.p<=left).sort((a,b)=>b.p-a.p).slice(0,4);
 return`<div class="wg"><div class="plate"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="var(--sf)" stroke="var(--ln)" stroke-width="2"/><circle cx="100" cy="100" r="84" fill="none" stroke="var(--ln)" stroke-width="12"/><circle class="ring" cx="100" cy="100" r="84" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>
 <div class="mid"><div class="big" style="color:${left<0?"var(--chi)":"var(--ink)"}">${rs(Math.abs(left))}</div><small>${left<0?"over today’s cap":"left for lunch and dinner"}</small></div></div>
 <div class="tiny"><div><b>${rs(rem)}</b>left this month</div><div><b>${rs(perDay)}</b>a day</div><div><b>${wk} of ${s.bir}</b>biryani</div></div>
 <div class="chips">${fits.map(x=>`<button class="chip" onclick="quick('${x.id}')"><span class="em">${fi(x.n)}</span>${e(x.n)} ${rs(x.p)}</button>`).join("")}</div>
 <div class="wlinks"><button class="btn ghost" onclick="undoQ()" ${lastQ?"":"disabled"}>${ic("undo",18)}Undo</button><button class="btn ghost" onclick="openEntry()">Add meal</button><button class="btn" onclick="go('today')">Full app</button></div></div>`}
function quick(id){const x=S.menu.find(y=>y.id===id),h=new Date().getHours();if(!x)return;lastQ=uid();S.log.push({id:lastQ,d:iso(new Date()),m:/tea|coffee|chai/i.test(x.n)?"s":h<11?"b":h<17?"l":"d",n:x.n,p:x.p});save();render();toast("Logged "+x.n+" "+rs(x.p))}
function undoQ(){if(!lastQ)return;S.log=S.log.filter(y=>y.id!==lastQ);lastQ=null;save();render()}
addEventListener("hashchange",()=>{tab=location.hash==="#widget"?"widget":"today";render()});
function go(t){navigator.vibrate&&navigator.vibrate(8);tab=t;$("app").classList.add("in");clearTimeout(go.t);go.t=setTimeout(()=>$("app").classList.remove("in"),800);if(t==="widget")location.hash="widget";else if(location.hash)history.replaceState(null,"",location.pathname+location.search);render();scrollTo(0,0)}
render();
</script>
</body>
</html>
